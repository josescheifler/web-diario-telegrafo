# Arma las imágenes para Instagram y Facebook (public/redes/<id>.jpg) de las notas automáticas.
# Corre sola cada vez que cambia contenido/sugerencias.json, o a mano eligiendo la fecha.
name: Imágenes para redes

on:
  push:
    branches: [main]
    paths: [contenido/sugerencias.json, scripts/imagenes-redes.py]
  workflow_dispatch:
    inputs:
      fecha:
        description: Fecha de las notas (AAAA-MM-DD). Vacío = hoy en Argentina.
        required: false

permissions:
  contents: write

concurrency:
  group: imagenes-redes
  cancel-in-progress: false

jobs:
  imagenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.3.0
      - name: Armar imágenes
        run: python scripts/imagenes-redes.py ${{ github.event.inputs.fecha }}
      - name: Subir imágenes
        run: |
          git config user.name "El Telégrafo (imágenes)"
          git config user.email "actions@users.noreply.github.com"
          git add public/redes
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Imágenes para redes"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
